<!-- @dsCard group="Spacing" viewport="700x180" name="Borders & shadow" subtitle="Hairlines at rest; shadow only on hover" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font-body);padding:18px 20px}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:18px;align-items:center">
<div style="width:150px;height:82px;background:var(--paper);border:1px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft)">1px hairline</div>
<div style="width:150px;height:82px;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 40px -20px rgba(43,36,29,.25);transform:translateY(-5px);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft)">hover: −5px + shadow</div>
<div style="width:150px;height:82px;border:1.5px dashed var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft)">1.5px dashed = empty</div>
<div style="width:150px;height:82px;border:1.5px dashed var(--berry);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--berry-deep)">dashed berry = coupon</div>
</div></body></html>
