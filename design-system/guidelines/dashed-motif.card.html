<!-- @dsCard group="Brand" viewport="700x170" name="Dashed-line motif" subtitle="Dashed rules separate price from content, like a receipt" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font-body);padding:18px 20px}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:18px">
<div style="width:210px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px"><div style="font-family:var(--font-display);font-weight:600;font-size:16px">Cardamom loaf</div><div style="border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:13px;font-weight:700">AED 48 <span style="color:var(--ink-soft);font-weight:400">×1</span></div></div>
<div style="width:210px;background:var(--paper);border:1.5px dashed var(--berry);border-radius:16px;padding:18px;position:relative"><span style="position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--cream)"></span><span style="position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--cream)"></span><div style="font-family:var(--font-display);font-weight:600;font-size:16px">20% off Eid boxes</div><div style="border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;font-family:var(--font-mono);font-size:12.5px;display:flex;justify-content:space-between"><span>CODE</span><span>EID20</span></div></div>
<div style="font-size:12px;color:var(--ink-soft);max-width:180px;align-self:center;line-height:1.6">Dashed = tear-off, receipt, or empty state. Solid hairlines = structure.</div>
</div></body></html>
