<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font-body);padding:18px 20px}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:14px">

<div style="flex:1;min-width:0"><div style="height:56px;border-radius:12px;background:#FFFFFF;border:1px solid rgba(43,36,29,.08)"></div><b style="display:block;font-size:12.5px;margin-top:8px">Paper</b><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft)">#FFFFFF</span><div style="font-family:var(--font-body);font-size:10.5px;color:var(--ink-soft);margin-top:2px">Cards, surfaces</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:12px;background:#E7DECC;border:1px solid rgba(43,36,29,.08)"></div><b style="display:block;font-size:12.5px;margin-top:8px">Line</b><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft)">#E7DECC</span><div style="font-family:var(--font-body);font-size:10.5px;color:var(--ink-soft);margin-top:2px">Hairline borders</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:12px;background:#6b6155;border:1px solid rgba(43,36,29,.08)"></div><b style="display:block;font-size:12.5px;margin-top:8px">Ink soft</b><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft)">#6b6155</span><div style="font-family:var(--font-body);font-size:10.5px;color:var(--ink-soft);margin-top:2px">Secondary text</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:12px;background:#2B241D;border:1px solid rgba(43,36,29,.08)"></div><b style="display:block;font-size:12.5px;margin-top:8px">Ink</b><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft)">#2B241D</span><div style="font-family:var(--font-body);font-size:10.5px;color:var(--ink-soft);margin-top:2px">Body text, dark blocks</div></div>
</div></body></html>
