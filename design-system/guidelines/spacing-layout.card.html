<!-- @dsCard group="Spacing" viewport="700x190" name="Layout rhythm" subtitle="1180px max, 24px gutters, 64px section padding" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font-body);padding:18px 20px}*{box-sizing:border-box}</style></head><body><div style="border:1.5px dashed var(--line);border-radius:12px;padding:0 12px">
<div style="height:24px;background:var(--pistachio-soft);margin:0 -12px;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9.5px;color:var(--pistachio)">64px section padding</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:16px 0">
<div style="height:64px;background:var(--paper);border:1px solid var(--line);border-radius:22px"></div><div style="height:64px;background:var(--paper);border:1px solid var(--line);border-radius:22px"></div><div style="height:64px;background:var(--paper);border:1px solid var(--line);border-radius:22px"></div>
</div>
<div style="font-family:var(--font-mono);font-size:9.5px;color:var(--ink-soft);padding-bottom:10px">22px gap · content max 1180px · gutter 24px</div>
</div></body></html>
