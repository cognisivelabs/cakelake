name: Deploy to GitHub Pages

# POC deployment target — see docs/adr/ADR-002-hosting-and-deployment.md.
# GitHub Pages instead of AWS for now: zero setup cost, validates the
# generate-order/send-to-WhatsApp flow before the real build. Moving to
# AWS later is a hosting-config change only, not a rewrite.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build (static export)
        working-directory: app
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Add .nojekyll
        run: touch app/out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
